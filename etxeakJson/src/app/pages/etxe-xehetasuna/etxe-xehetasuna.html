<section class="interesdun-formularioa">
  <h2>Harremanetarako formularioa</h2>

  <form #interesForm="ngForm" (ngSubmit)="bidaliFormularioa(interesForm)">
    <div>
      <label for="izena">Izena:</label>
      <input type="text" id="izena" name="izena" [(ngModel)]="izena" required />
    </div>

    <div>
      <label for="abizena">Abizena:</label>
      <input type="text" id="abizena" name="abizena" [(ngModel)]="abizena" required />
    </div>

    <div>
      <label for="emaila">Emaila:</label>
      <input type="email" id="emaila" name="emaila" [(ngModel)]="emaila" required email />
    </div>

    <button type="submit" [disabled]="interesForm.invalid">Bidali</button>
  </form>
</section>

<section class="interesdun-zerrenda">
  <h2>Interesdunen zerrenda</h2>

  <ul>
    @for (interesduna of etxekoInteresdunak(); track $index) {
      <li>
        <strong>{{ interesduna.izena }} {{ interesduna.abizena }}</strong> -
        {{ interesduna.emaila }}
      </li>
    } @empty {
      <p>Oraindik ez dago interesdunik etxe honetarako.</p>
    }
  </ul>
</section>
